# Reference ALSA PCM chain; select your own card and shared IPC policy.
pcm.!default {
    type plug
    slave.pcm "rkvol"
}
pcm.rkvol {
    @args [ SLAVE ]
    @args.SLAVE { type string default "rkdmix" }
    type softvol
    slave.pcm $SLAVE
    control { name "Music Playback Volume" card 0 }
    min_dB -80.0
    max_dB 0.0
    resolution 512
}
pcm.rkdmix {
    type dmix
    ipc_key 304304
    ipc_key_add_uid false
    ipc_perm 0660
    ipc_gid audio
    slave {
        pcm "hw:0,0,0"
        rate 44100
        channels 2
        format S16_LE
        period_size 1024
        buffer_size 3072
    }
}
ctl.!default {
    type hw
    card 0
}
