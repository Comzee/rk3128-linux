# Minimal station-mode reference settings; independently written from hardware configuration facts.
# Firmware is not distributed here. Supply separately under its own redistribution terms.
firmware_path = /lib/firmware/
xtal_clock = 24
volt_regulator = 1
hw_cap_ampdu_rx = on
hw_cap_ampdu_tx = on
hw_cap_tdls = off
hw_cap_5ghz = off
use_wpa2_only = 1
directly_ack_low_threshold = 64
directly_ack_high_threshold = 512
txrxboost_low_threshold = 999
txrxboost_high_threshold = 999
online_reset = 0x00f
hw_cap_p2p = off
